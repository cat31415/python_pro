<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Практика: Pokémon Finder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(180deg, #fff7ed, #ffffff);
    }
    .hero {
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: white;
      border-radius: 24px;
      padding: 40px;
    }
    .pokemon-img {
      width: 180px;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <nav class="navbar bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-danger" href="#">Pokémon Finder</a>
    </div>
  </nav>

  <main class="container py-5">
    <section class="hero mb-5">
      <h1 class="display-5 fw-bold">Найди покемона</h1>
      <p class="lead mb-0">Введите имя покемона на английском: pikachu, charizard, bulbasaur.</p>
    </section>

    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="card border-0 shadow rounded-4">
          <div class="card-body p-4">
            <label class="form-label">Имя покемона</label>
            <input id="pokemonInput" class="form-control form-control-lg mb-3" placeholder="pikachu">
            <button class="btn btn-danger w-100 mb-4" onclick="loadPokemon()">Найти</button>

            <div id="pokemonResult" class="text-center">
              <p class="text-muted mb-0">Результат появится здесь.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    async function loadPokemon() {
      const input = document.getElementById("pokemonInput");
      const result = document.getElementById("pokemonResult");
      const name = input.value.toLowerCase().trim();

      if (name === "") {
        result.innerHTML = `<div class="alert alert-warning">Введите имя покемона.</div>`;
        return;
      }

      result.innerHTML = "Загрузка...";

      try {
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);

        if (!response.ok) {
          result.innerHTML = `<div class="alert alert-danger">Покемон не найден.</div>`;
          return;
        }

        const data = await response.json();
        const types = data.types[0].type.name;

        result.innerHTML = `
          <img class="pokemon-img mb-3" src="${data.sprites.front_default}" alt="${data.name}">
          <h2 class="text-capitalize">${data.name}</h2>
          <p><strong>ID:</strong> ${data.id}</p>
          <p><strong>Рост:</strong> ${data.height}</p>
          <p><strong>Вес:</strong> ${data.weight}</p>
          <p><strong>Тип:</strong> ${types}</p>
        `;
      } catch (error) {
        result.innerHTML = `<div class="alert alert-danger">Ошибка загрузки данных.</div>`;
      }
    }
  </script>
</body>
</html>
