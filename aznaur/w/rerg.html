<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>Animated Background</title>
    <style>
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .container {
            
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;

       
        background: #121212; 
        background: linear-gradient(
            135deg,
            #121212 25%,
            #1a1a1a 25%,
            #1a1a1a 50%,
            #121212 50%,
            #121212 75%,
            #1a1a1a 75%,
            #1a1a1a
        );
        background-size: 40px 40px;

     
        animation: move 4s linear infinite;
        }

    @keyframes move {
        0% {
            background-position: 0 0;
        }
        100% {
            background-position: 40px 40px;
        }
        }

    </style>
</head>
<body> 
    <div class="container"></div>
</body>
</html>
