<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo: Погода и шутка дня</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(180deg, #eef2ff, #ffffff);
    }
    .hero {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border-radius: 24px;
      padding: 42px;
    }
    .result-box {
      min-height: 130px;
      background: #f8f9fa;
      border-radius: 16px;
      padding: 18px;
    }
  </style>
</head>
<body>
  <nav class="navbar bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="#">API Demo</a>
    </div>
  </nav>

  <main class="container py-5">
    <section class="hero mb-5">
      <h1 class="display-5 fw-bold">Погода и шутка дня</h1>
      <p class="lead mb-0">Пример сайта: Bootstrap отвечает за внешний вид, JavaScript получает данные из API.</p>
    </section>

    <div class="row g-4">
      <div class="col-md-6">
        <div class="card border-0 shadow h-100 rounded-4">
          <div class="card-body p-4">
            <h2 class="h4 mb-3">Погода в Москве</h2>
            <div id="weatherResult" class="result-box mb-3">Нажмите кнопку, чтобы загрузить погоду.</div>
            <button class="btn btn-primary w-100" onclick="loadWeather()">Загрузить погоду</button>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card border-0 shadow h-100 rounded-4">
          <div class="card-body p-4">
            <h2 class="h4 mb-3">Случайная шутка</h2>
            <div id="jokeResult" class="result-box mb-3">Нажмите кнопку, чтобы загрузить шутку.</div>
            <button class="btn btn-success w-100" onclick="loadJoke()">Получить шутку</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    async function loadWeather() {
      let box = document.getElementById("weatherResult");
      box.innerHTML = "Загрузка...";

      try {
        const url = "https://api.open-meteo.com/v1/forecast?latitude=55.75&longitude=37.62&current=temperature_2m,wind_speed_10m";
        const response = await fetch(url);
        const data = await response.json();

        box.innerHTML = `
          <strong>Температура:</strong> ${data.current.temperature_2m}${data.current_units.temperature_2m}<br>
          <strong>Скорость ветра:</strong> ${data.current.wind_speed_10m} ${data.current_units.wind_speed_10m}<br>
          <strong>Время:</strong> ${data.current.time}
        `;
      } catch (error) {
        box.innerHTML = "Ошибка загрузки погоды.";
      }
    }

    async function loadJoke() {
        let box = document.getElementById("jokeResult")
        box,innerHTML = "Загрузка...";

        try{
            const url2 = "https://v2.jokeapi.dev/joke/Programming?blacklistFlags=nsfw,religious,political,racist,sexist,explicit";
            const ressponce = await fetch(url);
            const data2 = await ressponce.json();

            box.innerHTML = `
            <strong>шутка дня</strong>${data2.joke}<br>
                ${data2.delivery}<br>
            `

        } catch (error) {
            box.innerHTML = "Ошибка загрузки шутки"
        }
    }


  </script>
</body>
</html>
